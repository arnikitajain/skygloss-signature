<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyGloss · Email Signature Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <img class="hdr-logo" id="hdr_logo" alt="SkyGloss" />
      <div class="hdr-sep"></div>
      <div class="hdr-ttl">Signature Builder</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div>
        <div class="pnl" style="margin-bottom:20px">
          <div class="pnl-hdr"><div class="pnl-dot"></div><div class="pnl-ttl">Your Details</div></div>
          <div class="pnl-body">
            <div class="fsec">
              <div class="fsec-lbl">Identity</div>
              <div class="field"><label>Full Name</label><input type="text" id="f_name" placeholder="Neil Erickson"></div>
              <div class="field"><label>Job Title</label><input type="text" id="f_title" placeholder="Regional Director"></div>
              <div class="field"><label>Company / Division</label><input type="text" id="f_company" placeholder="SkyGloss Global"></div>
            </div>
            <div class="fsec">
              <div class="fsec-lbl">Contact</div>
              <div class="field"><label>Telephone</label><input type="tel" id="f_tel" placeholder="+1 (602) 784-41134"></div>
              <div class="field"><label>Mobile</label><input type="tel" id="f_mobile" placeholder="+1 (602) 784-4113‬"></div>
              <div class="field"><label>Email</label><input type="email" id="f_email" placeholder="name@skygloss.com"></div>
              <div class="field"><label>Website</label><input type="url" id="f_website" placeholder="https://skygloss.com"></div>
              <div class="field"><label>Address <span style="color:var(--muted2);font-size:10px">(optional)</span></label><input type="text" id="f_address" placeholder="8342 W Camelback Rd, STE 205 Scottsdale AZ 85251 United States"></div>
            </div>
            <div class="fsec">
              <div class="fsec-lbl">Optional Extras</div>
              <div class="tog" id="tog_tagline" data-opt="tagline">
                <span class="tog-lbl">Show Tagline</span><div class="tog-pill"></div>
              </div>
              <div class="tog-sub" id="sub_tagline">
                <div class="field">
                  <label>Tagline style</label>
                  <div class="mode-btns" role="group" aria-label="Tagline style">
                    <button class="mode-btn active" type="button" data-tagmode="text">Text</button>
                    <button class="mode-btn" type="button" data-tagmode="image">Image</button>
                  </div>
                </div>
              </div>
              <div class="tog" id="tog_hiring" data-opt="hiring">
                <span class="tog-lbl">🚀 We Are Hiring!</span><div class="tog-pill"></div>
              </div>
              <div class="tog" id="tog_demo" data-opt="demo">
                <span class="tog-lbl">Book a Consultation</span><div class="tog-pill"></div>
              </div>
              <div class="tog-sub" id="sub_demo">
                <div class="field"><label>Consultation URL</label><input type="url" id="f_demo" placeholder="https://demo.skygloss.com"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT: PREVIEW -->
      <div>
        <div class="pnl" style="margin-bottom:20px">
          <div class="pnl-hdr"><div class="pnl-dot"></div><div class="pnl-ttl">Choose Layout</div></div>
          <div class="pnl-body">
            <div class="lpick">
              <div class="lopt sel" id="lopt_7" data-layout="7"><div class="lopt-name">Spotlight</div></div>
              <div class="lopt" id="lopt_1" data-layout="1"><div class="lopt-name">Showcase</div></div>
              <div class="lopt" id="lopt_2" data-layout="2"><div class="lopt-name">Ribbon</div></div>
              <div class="lopt" id="lopt_3" data-layout="3"><div class="lopt-name">Classic</div></div>
              <div class="lopt" id="lopt_4" data-layout="4"><div class="lopt-name">Banner</div></div>
              <div class="lopt" id="lopt_5" data-layout="5"><div class="lopt-name">Studio</div></div>
              <div class="lopt" id="lopt_6" data-layout="6"><div class="lopt-name">Split</div></div>
            </div>
          </div>
        </div>

        <div class="pnl" style="position:sticky;top:24px">
          <div class="prev-tb">
            <div class="prev-ttl"><div class="pnl-dot"></div>Live Preview</div>
            <div class="prev-actions">
              <div class="bg-btns">
                <button class="bg-btn" data-bg="dark">Dark</button>
                <button class="bg-btn" data-bg="mid">Grey</button>
                <button class="bg-btn active" data-bg="white">White</button>
              </div>
              <button class="btn" id="btn_copy">Copy Signature</button>
              <button class="btn btn-sky" id="btn_download">⬇ Download</button>
            </div>
          </div>
          <div class="prev-stage bg-white" id="prev_stage">
            <div id="sig_preview"></div>
          </div>
          <div class="out-wrap">
            <div class="out-lbl">HTML Code — paste into Gmail / Outlook / Apple Mail</div>
            <textarea class="out-ta" id="html_out" readonly></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast">✓ Copied to clipboard!</div>
  <script src="./app.js"></script>
</body>
</html>
