<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyGloss · Email Signature Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <img class="hdr-logo" id="hdr_logo" alt="SkyGloss" />
      <div class="hdr-sep"></div>
      <div class="hdr-ttl">Signature Builder</div>
    </div>

    <div class="grid">
      <!-- LEFT -->
      <div>
        <div class="pnl" style="margin-bottom:20px">
          <div class="pnl-hdr"><div class="pnl-dot"></div><div class="pnl-ttl">Your Details</div></div>
          <div class="pnl-body">
            <div class="fsec">
              <div class="fsec-lbl">Identity</div>
              <div class="field"><label>Full Name</label><input type="text" id="f_name" placeholder="Neil Erickson"></div>
              <div class="field"><label>Job Title</label><input type="text" id="f_title" placeholder="Regional Director"></div>
              <div class="field"><label>Company / Division</label><input type="text" id="f_company" placeholder="SkyGloss Global"></div>
            </div>
            <div class="fsec">
              <div class="fsec-lbl">Contact</div>
              <div class="field"><label>Telephone</label><input type="tel" id="f_tel" placeholder="+1 (602) 784-41134"></div>
              <div class="field"><label>Mobile</label><input type="tel" id="f_mobile" placeholder="+1 (602) 784-4113‬"></div>
              <div class="field"><label>Email</label><input type="email" id="f_email" placeholder="name@skygloss.com"></div>
              <div class="field"><label>Website</label><input type="url" id="f_website" placeholder="https://skygloss.com"></div>
              <div class="field"><label>Address <span style="color:var(--muted2);font-size:10px">(optional)</span></label><input type="text" id="f_address" placeholder="8342 W Camelback Rd, STE 205 Scottsdale AZ 85251 United States"></div>
            </div>
            <div class="fsec">
              <div class="fsec-lbl">Optional Extras</div>
              <div class="tog" id="tog_tagline" data-opt="tagline">
                <span class="tog-lbl">Show Tagline</span><div class="tog-pill"></div>
              </div>
              <div class="tog-sub" id="sub_tagline">
                <div class="field">
                  <label>Tagline style</label>
                  <div class="mode-btns" role="group" aria-label="Tagline style">
                    <button class="mode-btn active" type="button" data-tagmode="text">Text</button>
                    <button class="mode-btn" type="button" data-tagmode="image">Image</button>
                  </div>
                </div>
              </div>
              <div class="tog" id="tog_hiring" data-opt="hiring">
                <span class="tog-lbl">🚀 We Are Hiring!</span><div class="tog-pill"></div>
              </div>
              <div class="tog" id="tog_demo" data-opt="demo">
                <span class="tog-lbl">Book a Consultation</span><div class="tog-pill"></div>
              </div>
              <div class="tog-sub" id="sub_demo">
                <div class="field"><label>Consultation URL</label><input type="url" id="f_demo" placeholder="https://demo.skygloss.com"></div>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- RIGHT: PREVIEW -->
      <div>
        <div class="pnl" style="margin-bottom:20px">
          <div class="pnl-hdr"><div class="pnl-dot"></div><div class="pnl-ttl">Choose Layout</div></div>
          <div class="pnl-body">
            <div class="lpick">
              <div class="lopt sel" id="lopt_1" data-layout="1">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:6px">
                    <rect x="6" y="10" width="60" height="4" rx="2" fill="#1a2332" opacity=".7"/>
                    <rect x="6" y="17" width="40" height="3" rx="1.5" fill="#7a8ea3" opacity=".45"/>
                    <line x1="6" y1="24" x2="114" y2="24" stroke="#dce4ed" stroke-width="1"/>
                    <rect x="10" y="28" width="42" height="10" rx="2" fill="#00a0df" opacity=".2"/>
                    <rect x="66" y="28" width="44" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".45"/>
                    <rect x="66" y="33" width="36" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".35"/>
                    <rect x="6" y="40" width="108" height="6" rx="2" fill="#00a0df" opacity=".18"/>
                  </svg>
                </div>
                <div class="lopt-name">Showcase</div>
              </div>

              <div class="lopt" id="lopt_2" data-layout="2">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:6px">
                    <rect x="6" y="9" width="50" height="4" rx="2" fill="#00a0df" opacity=".55"/>
                    <rect x="6" y="16" width="36" height="3" rx="1.5" fill="#1a2332" opacity=".65"/>
                    <rect x="6" y="22" width="30" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".4"/>
                    <rect x="66" y="10" width="48" height="16" rx="3" fill="#00a0df" opacity=".12"/>
                    <rect x="6" y="30" width="108" height="10" rx="3" fill="#00a0df" opacity=".2"/>
                    <rect x="14" y="34" width="70" height="3" rx="1.5" fill="#ffffff" opacity=".75"/>
                  </svg>
                </div>
                <div class="lopt-name">Ribbon</div>
              </div>
              <div class="lopt" id="lopt_3" data-layout="3">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:5px">
                    <circle cx="20" cy="24" r="10" fill="#00a0df" opacity=".85"/>
                    <line x1="34" y1="13" x2="34" y2="35" stroke="#00a0df" stroke-width="1.5"/>
                    <rect x="38" y="13" width="38" height="4" rx="2" fill="#1a2332" opacity=".7"/>
                    <rect x="38" y="20" width="26" height="3" rx="1.5" fill="#00a0df" opacity=".8"/>
                    <rect x="38" y="27" width="52" height="2" rx="1" fill="#7a8ea3" opacity=".5"/>
                    <rect x="38" y="31" width="40" height="2" rx="1" fill="#7a8ea3" opacity=".4"/>
                  </svg>
                </div>
                <div class="lopt-name">Classic</div>
              </div>
              <div class="lopt" id="lopt_4" data-layout="4">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:6px">
                    <rect x="6" y="10" width="46" height="4" rx="2" fill="#1a2332" opacity=".7"/>
                    <rect x="6" y="17" width="30" height="3" rx="1.5" fill="#7a8ea3" opacity=".45"/>
                    <rect x="70" y="10" width="44" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".45"/>
                    <rect x="70" y="15" width="36" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".35"/>
                    <rect x="6" y="26" width="108" height="14" rx="3" fill="#00a0df" opacity=".2"/>
                    <rect x="14" y="31" width="78" height="3" rx="1.5" fill="#ffffff" opacity=".75"/>
                  </svg>
                </div>
                <div class="lopt-name">Banner</div>
              </div>
              <div class="lopt" id="lopt_5" data-layout="5">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:6px">
                    <rect x="6" y="9" width="40" height="6" rx="2" fill="#00a0df" opacity=".55"/>
                    <rect x="6" y="18" width="54" height="4" rx="2" fill="#1a2332" opacity=".7"/>
                    <rect x="6" y="25" width="28" height="3" rx="1.5" fill="#00a0df" opacity=".7"/>
                    <rect x="72" y="14" width="42" height="20" rx="3" fill="#00a0df" opacity=".12"/>
                    <rect x="78" y="18" width="30" height="3" rx="1.5" fill="#00a0df" opacity=".7"/>
                    <rect x="78" y="24" width="24" height="2.5" rx="1.2" fill="#7a8ea3" opacity=".5"/>
                  </svg>
                </div>
                <div class="lopt-name">Studio</div>
              </div>
              <div class="lopt" id="lopt_6" data-layout="6">
                <div class="lopt-thumb">
                  <svg viewBox="0 0 120 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;padding:5px">
                    <rect x="3" y="5" width="114" height="38" rx="3" fill="#f8fafc"/>
                    <rect x="3" y="5" width="114" height="3" rx="1.5" fill="#00a0df"/>
                    <rect x="9" y="13" width="30" height="4" rx="2" fill="#1a2332" opacity=".7"/>
                    <rect x="9" y="20" width="22" height="3" rx="1.5" fill="#00a0df" opacity=".7"/>
                    <line x1="9" y1="27" x2="111" y2="27" stroke="#dce4ed" stroke-width=".8"/>
                    <rect x="9" y="30" width="42" height="2" rx="1" fill="#7a8ea3" opacity=".5"/>
                    <rect x="9" y="34" width="34" height="2" rx="1" fill="#7a8ea3" opacity=".4"/>
                    <circle cx="96" cy="18" r="6" fill="#00a0df" opacity=".3"/>
                    <rect x="84" y="27" width="24" height="10" rx="2" fill="#00a0df" opacity=".15"/>
                  </svg>
                </div>
                <div class="lopt-name">Split</div>
              </div>
            </div>
          </div>
        </div>

        <div class="pnl" style="position:sticky;top:24px">
          <div class="prev-tb">
            <div class="prev-ttl"><div class="pnl-dot"></div>Live Preview</div>
            <div class="prev-actions">
              <div class="bg-btns">
                <button class="bg-btn" data-bg="dark">Dark</button>
                <button class="bg-btn" data-bg="mid">Grey</button>
                <button class="bg-btn active" data-bg="white">White</button>
              </div>
              <button class="btn" id="btn_copy">Copy Signature</button>
              <button class="btn btn-sky" id="btn_download">⬇ Download</button>
            </div>
          </div>
          <div class="prev-stage bg-white" id="prev_stage">
            <div id="sig_preview"></div>
          </div>
          <div class="out-wrap">
            <div class="out-lbl">HTML Code — paste into Gmail / Outlook / Apple Mail</div>
            <textarea class="out-ta" id="html_out" readonly></textarea>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast">✓ Copied to clipboard!</div>
  <script src="./app.js"></script>
</body>
</html>
